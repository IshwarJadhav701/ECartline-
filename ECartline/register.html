<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | ECartline</title><meta name="description" content="ECartline - Smart products. Better everyday.">
<link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div>
<main class="container"><form id="register-form" class="form-card" novalidate><h1>Create Account</h1>
<div class="field"><label for="n">Full Name</label><input id="n" name="name"><span class="err"></span></div>
<div class="field"><label for="e">Email</label><input id="e" name="email" type="email"><span class="err"></span></div>
<div class="field"><label for="m">Mobile</label><input id="m" name="mobile" inputmode="numeric" maxlength="10"><span class="err"></span></div>
<div class="field"><label for="p">Password</label><input id="p" name="password" type="password"><span class="err"></span></div>
<div class="field"><label for="c">Confirm Password</label><input id="c" name="confirm" type="password"><span class="err"></span></div>
<button class="btn">Register</button><p style="margin-top:14px;text-align:center">Already registered? <a href="login.html">Login</a></p></form></main>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script>
</body></html>
