<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Account | ECartline</title>
  <meta name="description" content="Manage your ECartline account details, addresses, and password.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="profile-layout" style="margin:30px 0 60px;">
      
      <!-- Left sidebar -->
      <aside class="profile-sidebar">
        <div class="profile-avatar-card">
          <div class="avatar-circle" id="user-avatar-initials">EC</div>
          <h2 id="prof-sidebar-name">User Name</h2>
          <small id="prof-sidebar-email">user@example.com</small>
        </div>

        <nav class="profile-nav">
          <button class="p-nav-link active" data-tab="info">👤 Personal Info</button>
          <button class="p-nav-link" data-tab="addresses">📍 Saved Addresses</button>
          <button class="p-nav-link" data-tab="security">🔒 Password & Security</button>
          <a class="p-nav-link" href="orders.html">📦 My Orders</a>
          <a class="p-nav-link" href="wishlist.html">♥ My Wishlist</a>
          <button class="p-nav-link logout-nav" onclick="logout()">🚪 Sign Out</button>
        </nav>
      </aside>

      <!-- Right Content Panels -->
      <section class="profile-content">
        
        <!-- Tab 1: Personal Info -->
        <div class="p-panel active" id="tab-info">
          <h2>Personal Information</h2>
          <form id="edit-profile-form" class="form-card" style="max-width:100%;margin:20px 0;box-shadow:none;">
            <div class="field">
              <label for="p-name">Full Name</label>
              <input id="p-name" name="name" required>
              <span class="err"></span>
            </div>
            <div class="field">
              <label for="p-email">Email Address (Registered)</label>
              <input id="p-email" name="email" disabled style="background:var(--light-bg);cursor:not-allowed;">
              <small style="color:var(--muted);">Email cannot be changed once verified.</small>
            </div>
            <div class="field">
              <label for="p-mobile">Mobile Number</label>
              <input id="p-mobile" name="mobile" maxlength="10" inputmode="numeric">
              <span class="err"></span>
            </div>
            <button class="btn" type="submit" style="align-self:flex-start;">Save Changes</button>
          </form>
        </div>

        <!-- Tab 2: Saved Addresses -->
        <div class="p-panel" id="tab-addresses">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <h2>Saved Delivery Addresses</h2>
            <button class="btn" id="open-add-addr-modal">+ Add New Address</button>
          </div>

          <div id="profile-addresses-grid" class="addresses-grid" style="margin-top:20px;">
            <div class="skel" style="height:120px;"></div>
          </div>

          <!-- Add Address Form -->
          <form id="prof-addr-form" class="form-card" style="display:none;max-width:100%;margin:24px 0;box-shadow:none;border-color:var(--primary);">
            <h3 id="addr-form-title">Add Delivery Address</h3>
            <div class="field-grid">
              <div class="field">
                <label for="pa-name">Recipient Name *</label>
                <input id="pa-name" required placeholder="Full Name">
              </div>
              <div class="field">
                <label for="pa-phone">Mobile Number *</label>
                <input id="pa-phone" maxlength="10" inputmode="numeric" required placeholder="10-digit mobile">
              </div>
            </div>
            <div class="field">
              <label for="pa-street">Street / House / Colony *</label>
              <input id="pa-street" required placeholder="Complete address">
            </div>
            <div class="field-grid" style="grid-template-columns:1fr 1fr 1fr;">
              <div class="field">
                <label for="pa-city">City *</label>
                <input id="pa-city" required placeholder="City">
              </div>
              <div class="field">
                <label for="pa-state">State *</label>
                <input id="pa-state" required placeholder="State">
              </div>
              <div class="field">
                <label for="pa-pin">Pincode *</label>
                <input id="pa-pin" maxlength="6" inputmode="numeric" required placeholder="Pincode">
              </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:12px;">
              <button type="submit" class="btn">Save Address</button>
              <button type="button" class="btn line" id="close-addr-form">Cancel</button>
            </div>
          </form>
        </div>

        <!-- Tab 3: Security & Password -->
        <div class="p-panel" id="tab-security">
          <h2>Change Password</h2>
          <form id="change-pwd-form" class="form-card" style="max-width:480px;margin:20px 0;box-shadow:none;">
            <div class="field">
              <label for="cp-cur">Current Password</label>
              <input id="cp-cur" type="password" required autocomplete="current-password">
            </div>
            <div class="field">
              <label for="cp-new">New Password (at least 6 characters)</label>
              <input id="cp-new" type="password" required autocomplete="new-password">
            </div>
            <div class="field">
              <label for="cp-conf">Confirm New Password</label>
              <input id="cp-conf" type="password" required autocomplete="new-password">
            </div>
            <button class="btn" type="submit" style="width:100%;">Update Password</button>
          </form>
        </div>

      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await productsReady;
      const user = getUser();
      if (!user) {
        location.href = "login.html?redirect=profile.html";
        return;
      }

      // Populate user info
      $("#prof-sidebar-name").textContent = user.name;
      $("#prof-sidebar-email").textContent = user.email;
      $("#p-name").value = user.name;
      $("#p-email").value = user.email;
      $("#p-mobile").value = user.mobile || "";

      const initials = user.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
      $("#user-avatar-initials").textContent = initials || "EC";

      setupTabs();
      setupProfileForm();
      loadProfileAddresses();
      setupPasswordForm();
    });

    function setupTabs() {
      $$(".p-nav-link[data-tab]").forEach(btn => {
        btn.onclick = () => {
          $$(".p-nav-link").forEach(b => b.classList.remove("active"));
          $$(".p-panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          $("#tab-" + btn.dataset.tab).classList.add("active");
        };
      });
    }

    function setupProfileForm() {
      const form = $("#edit-profile-form");
      form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button");
        btn.disabled = true;
        btn.textContent = "Saving...";
        try {
          const res = await updateProfile({
            name: $("#p-name").value.trim(),
            mobile: $("#p-mobile").value.trim()
          });
          saveSession(getToken(), res.user);
          $("#prof-sidebar-name").textContent = res.user.name;
          showToast("✓ Profile updated successfully");
        } catch (err) {
          showToast(err.message || "Failed to update profile");
        } finally {
          btn.disabled = false;
          btn.textContent = "Save Changes";
        }
      };
    }

    async function loadProfileAddresses() {
      const container = $("#profile-addresses-grid");
      try {
        const list = await fetchAddresses();
        if (!list.length) {
          container.innerHTML = `<p style="color:var(--muted);grid-column:1/-1;">No addresses saved yet. Click "+ Add New Address" above to add one.</p>`;
          return;
        }

        container.innerHTML = list.map(a => `
          <div class="addr-card">
            <div class="addr-details">
              <b>${a.full_name} ${a.is_default ? `<span class="badge" style="position:static;font-size:0.7rem;padding:2px 7px;">DEFAULT</span>` : ""}</b>
              <p>${a.street}, ${a.city}, ${a.state} - ${a.pincode}</p>
              <small>📞 Phone: ${a.phone}</small>
              <div style="display:flex;gap:8px;margin-top:12px;">
                ${!a.is_default ? `<button class="btn line" style="min-height:34px;padding:0 10px;font-size:0.8rem;" onclick="makeDefaultAddr(${a.id})">Set as Default</button>` : ""}
                <button class="btn line" style="min-height:34px;padding:0 10px;font-size:0.8rem;color:#c00;border-color:#c00;" onclick="removeAddr(${a.id})">Delete</button>
              </div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="color:#c00;">Failed to load addresses.</p>`;
      }
    }

    const addrForm = $("#prof-addr-form");
    $("#open-add-addr-modal").onclick = () => {
      addrForm.style.display = "block";
      addrForm.scrollIntoView({ behavior: "smooth" });
    };
    $("#close-addr-form").onclick = () => {
      addrForm.style.display = "none";
      addrForm.reset();
    };

    addrForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await saveAddress({
          fullName: $("#pa-name").value.trim(),
          phone: $("#pa-phone").value.trim(),
          street: $("#pa-street").value.trim(),
          city: $("#pa-city").value.trim(),
          state: $("#pa-state").value.trim(),
          pincode: $("#pa-pin").value.trim(),
          isDefault: false
        });
        showToast("✓ Address added");
        addrForm.reset();
        addrForm.style.display = "none";
        loadProfileAddresses();
      } catch (err) {
        showToast(err.message || "Failed to add address");
      }
    };

    async function makeDefaultAddr(id) {
      try {
        await setDefaultAddress(id);
        showToast("✓ Default address updated");
        loadProfileAddresses();
      } catch (err) {
        showToast(err.message || "Failed to update default address");
      }
    }

    async function removeAddr(id) {
      if (!confirm("Are you sure you want to delete this address?")) return;
      try {
        await deleteAddress(id);
        showToast("Address deleted");
        loadProfileAddresses();
      } catch (err) {
        showToast(err.message || "Failed to delete address");
      }
    }

    function setupPasswordForm() {
      const form = $("#change-pwd-form");
      form.onsubmit = async (e) => {
        e.preventDefault();
        const cur = $("#cp-cur").value;
        const n1 = $("#cp-new").value;
        const n2 = $("#cp-conf").value;

        if (n1 !== n2) {
          showToast("New passwords do not match");
          return;
        }
        if (n1.length < 6) {
          showToast("Password must be at least 6 characters");
          return;
        }

        try {
          await changePassword({ currentPassword: cur, newPassword: n1 });
          showToast("✓ Password changed successfully!");
          form.reset();
        } catch (err) {
          showToast(err.message || "Failed to change password");
        }
      };
    }
  </script>
</body>
</html>
