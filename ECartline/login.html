<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | ECartline</title><meta name="description" content="ECartline - Smart products. Better everyday.">
<link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div>
<main class="container"><form id="login-form" class="form-card" novalidate><h1>Login</h1>
<div class="field"><label for="id">Email / Mobile</label><input id="id" name="id" autocomplete="username"><span class="err"></span></div>
<div class="field"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password"><span class="err"></span></div>
<div class="between"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button class="btn">Login</button>
<p style="margin-top:14px;text-align:center">Don't have an account? <a href="register.html">Create Account</a></p></form></main>
<div id="site-footer"></div>
<script src="js/api.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script>
</body></html>
