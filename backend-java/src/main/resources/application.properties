# ECartline Spring Boot Configuration
server.port=3000

# Database Configuration (MySQL / MariaDB)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecartline}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Preserve existing schema & records)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ecartline_kahihi_lamb_random_text_2026_xyz_spring_boot_secret_key_1234567890}
app.jwt.expiration-ms=604800000

# CORS Configuration
cors.allowed-origins=${CORS_ORIGIN:*}

# Jackson JSON Configuration (Prevent 'Invalid JSON' on unknown/flexible fields)
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
